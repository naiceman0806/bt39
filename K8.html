<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập K8 - Tính Chỉ Số BMI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            background: rgba(30, 41, 59, 0.7);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            font-size: 1.5rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        .student-info {
            font-size: 0.95rem;
            color: #cbd5e1;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #475569;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #0369a1;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #0f172a;
            border-radius: 6px;
            border: 1px dashed #38bdf8;
            text-align: center;
            display: none;
        }
        .result-box.active {
            display: block;
        }
        .bmi-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 5px;
        }
        .bmi-status {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            background: rgba(30, 41, 59, 0.7);
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .back-link:hover {
            background: #0284c7;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>BÀI TẬP K8: TÍNH CHỈ SỐ BMI</h1>
        <div class="student-info">
            Họ và tên: <strong>Phạm Nguyễn Nhật Anh</strong> | MSSV: <strong>241A010037</strong>
        </div>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="weight">Cân nặng (kg):</label>
            <input type="number" id="weight" step="0.1" placeholder="Ví dụ: 65">
        </div>
        
        <div class="form-group">
            <label for="height">Chiều cao (m):</label>
            <input type="number" id="height" step="0.01" placeholder="Ví dụ: 1.70">
        </div>

        <button onclick="calculateBMI()">Tính Chỉ Số BMI</button>

        <div class="result-box" id="resultBox">
            <div class="bmi-value" id="bmiValue"></div>
            <div class="bmi-status" id="bmiStatus"></div>
        </div>
    </div>

    <a href="index.html" class="back-link">&larr; Quay lại Trang Chủ (bt39.html)</a>

    <script>
        function calculateBMI() {
            const weight = parseFloat(document.getElementById('weight').value);
            const height = parseFloat(document.getElementById('height').value);
            const resultBox = document.getElementById('resultBox');
            const bmiValueEl = document.getElementById('bmiValue');
            const bmiStatusEl = document.getElementById('bmiStatus');

            if (!weight || !height || weight <= 0 || height <= 0) {
                alert('Vui lòng nhập cân nặng và chiều cao hợp lệ!');
                return;
            }

            const bmi = weight / (height * height);
            let status = '';
            let color = '';

            if (bmi < 18.5) {
                status = 'Thiếu cân';
                color = '#facc15';
            } else if (bmi >= 18.5 && bmi < 24.9) {
                status = 'Bình thường';
                color = '#4ade80';
            } else if (bmi >= 25 && bmi < 29.9) {
                status = 'Thừa cân';
                color = '#fb923c';
            } else {
                status = 'Béo phì';
                color = '#f87171';
            }

            bmiValueEl.textContent = `Chỉ số BMI của bạn: ${bmi.toFixed(2)}`;
            bmiStatusEl.textContent = `Phân loại: ${status}`;
            bmiStatusEl.style.color = color;
            resultBox.classList.add('active');
        }
    </script>

</body>
</html>
