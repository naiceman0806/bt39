<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập TK8 - Chuyển Đổi Hex sang RGB</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            background: rgba(30, 41, 59, 0.7);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            font-size: 1.4rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        .student-info {
            font-size: 0.95rem;
            color: #cbd5e1;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #475569;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
            color: #f8fafc;
            font-size: 1rem;
            text-transform: uppercase;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #0369a1;
        }
        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: #0f172a;
            border-radius: 6px;
            border: 1px dashed #38bdf8;
            text-align: center;
            display: none;
        }
        .result-box.active {
            display: block;
        }
        .color-preview {
            width: 80px;
            height: 40px;
            margin: 10px auto 15px auto;
            border-radius: 6px;
            border: 1px solid #fff;
        }
        .rgb-text {
            font-size: 1.2rem;
            font-weight: bold;
            color: #38bdf8;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            background: rgba(30, 41, 59, 0.7);
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .back-link:hover {
            background: #0284c7;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>BÀI TẬP TK8: CHUYỂN ĐỔI HEX SANG RGB</h1>
        <div class="student-info">
            Họ và tên: <strong>Phạm Nguyễn Nhật Anh</strong> | MSSV: <strong>241A010037</strong>
        </div>
    </header>

    <div class="container">
        <div class="form-group">
            <label for="hexInput">Nhập mã màu Hex (VD: #FF0000 hoặc FF0000):</label>
            <input type="text" id="hexInput" placeholder="#38BDF8">
        </div>

        <button onclick="convertHexToRgb()">Chuyển Đổi</button>

        <div class="result-box" id="resultBox">
            <div class="color-preview" id="colorPreview"></div>
            <div class="rgb-text" id="rgbOutput"></div>
        </div>
    </div>

    <a href="index.html" class="back-link">&larr; Quay lại Trang Chủ (bt39.html)</a>

    <script>
        function convertHexToRgb() {
            let hex = document.getElementById('hexInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const rgbOutput = document.getElementById('rgbOutput');
            const colorPreview = document.getElementById('colorPreview');

            if (hex.startsWith('#')) {
                hex = hex.slice(1);
            }

            if (hex.length === 3) {
                hex = hex.split('').map(char => char + char).join('');
            }

            const isValidHex = /^[0-9A-Fa-f]{6}$/.test(hex);
            if (!isValidHex) {
                alert('Mã màu Hex không hợp lệ! Vui lòng nhập đúng định dạng (VD: #FF0000)');
                return;
            }

            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);

            const rgbString = `rgb(${r}, ${g}, ${b})`;

            rgbOutput.textContent = rgbString;
            colorPreview.style.backgroundColor = rgbString;
            resultBox.classList.add('active');
        }
    </script>

</body>
</html>
