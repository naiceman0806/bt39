<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập K4 - Phân Trang Danh Sách</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            background: rgba(30, 41, 59, 0.7);
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            font-size: 1.5rem;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        .student-info {
            font-size: 0.95rem;
            color: #cbd5e1;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #475569;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        ul {
            list-style: none;
            margin-bottom: 20px;
        }
        li {
            background: #334155;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-size: 1rem;
            border-left: 4px solid #38bdf8;
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .page-btn {
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .page-btn:hover {
            background: #0284c7;
            border-color: #38bdf8;
        }
        .page-btn.active {
            background: #0284c7;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.5);
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            background: rgba(30, 41, 59, 0.7);
            padding: 10px 20px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .back-link:hover {
            background: #0284c7;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>BÀI TẬP K4: PHÂN TRANG DANH SÁCH</h1>
        <div class="student-info">
            Họ và tên: <strong>Phạm Nguyễn Nhật Anh</strong> | MSSV: <strong>241A010037</strong>
        </div>
    </header>

    <div class="container">
        <ul id="itemList"></ul>
        <div class="pagination" id="pagination"></div>
    </div>

    <a href="index.html" class="back-link">&larr; Quay lại Trang Chủ (bt39.html)</a>

    <script>
        const items = Array.from({ length: 50 }, (_, i) => `Mục số ${i + 1} - Dữ liệu thực hành môn học`);
        const itemsPerPage = 10;
        let currentPage = 1;

        function displayList(page) {
            const listEl = document.getElementById('itemList');
            listEl.innerHTML = '';
            
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const paginatedItems = items.slice(start, end);

            paginatedItems.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                listEl.appendChild(li);
            });
        }

        function setupPagination() {
            const paginationEl = document.getElementById('pagination');
            paginationEl.innerHTML = '';
            
            const pageCount = Math.ceil(items.length / itemsPerPage);

            for (let i = 1; i <= pageCount; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                
                btn.addEventListener('click', () => {
                    currentPage = i;
                    displayList(currentPage);
                    
                    document.querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });

                paginationEl.appendChild(btn);
            }
        }

        displayList(currentPage);
        setupPagination();
    </script>

</body>
</html>
